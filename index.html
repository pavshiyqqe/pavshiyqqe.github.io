<html lang="en">
<head>

  <link rel="icon" type="image/png" href="./favicon.png">
  <style>
    :root {
      /* === DEADLOCK THEME (ОРИГІНАЛЬНА КОЛЬОРОВА ПАЛІТРА) === */
      --bg-color: #08090a;
      --card-bg: rgba(14, 16, 15, 0.85);
      --accent: #c49a45; /* Латунь */
      --accent-dim: #7a6029;
      --text-main: #e2dcd0; /* Пергамент */
      --text-muted: #a3a3a3;
      
      --intern-border: #10b981;
      --intern-text: #10b981;
      --intern-bg: rgba(16, 185, 129, 0.1);
      
      --alt-border: #f59e0b;
      --alt-text: #f59e0b;
      --alt-bg: rgba(245, 158, 11, 0.1);
      
      --team-bg: rgba(127, 29, 29, 0.2);
      --team-border: #7f1d1d;
      --team-text: #fca5a5;
      
      --video-filter: grayscale(80%) sepia(30%) hue-rotate(90deg) contrast(120%);
      --overlay: radial-gradient(circle at center, rgba(10,12,10,0.5) 0%, rgba(5,6,5,0.95) 100%);
      --card-shadow-hover: inset 0 0 30px rgba(0,0,0,0.9), 0 0 20px rgba(196, 154, 69, 0.15);
    }

    [data-theme="rainy"] {
      /* === RAINY THEME (ДОЩОВА ТЕМА) === */
      --bg-color: #050a14;
      --card-bg: rgba(10, 15, 25, 0.75);
      --accent: #7dd3fc; /* Дощовий синій */
      --accent-dim: #0369a1;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      
      --intern-border: #38bdf8;
      --intern-text: #38bdf8;
      --intern-bg: rgba(56, 189, 248, 0.15);
      
      --alt-border: #818cf8;
      --alt-text: #818cf8;
      --alt-bg: rgba(129, 140, 248, 0.15);
      
      --team-bg: rgba(91, 33, 182, 0.3);
      --team-border: #8b5cf6;
      --team-text: #c4b5fd;
      
      --video-filter: grayscale(40%) hue-rotate(190deg) brightness(70%) contrast(110%);
      --overlay: linear-gradient(to bottom, rgba(5, 10, 20, 0.7) 0%, rgba(2, 5, 10, 0.98) 100%);
      --card-shadow-hover: inset 0 0 20px rgba(0,0,0,0.5), 0 5px 25px rgba(125, 211, 252, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      color: var(--text-main);
      background: var(--bg-color);
      position: relative;
      min-height: 100vh;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    /* Кнопка перемикання теми */
    .theme-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
    }

    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--accent-dim);
      color: var(--accent);
      font-family: 'Courier Prime', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.6rem 1rem;
      border-radius: 2px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .theme-btn:hover {
      background: var(--accent);
      color: var(--bg-color);
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }
